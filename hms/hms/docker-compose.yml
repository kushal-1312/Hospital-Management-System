# Keep the existing Compose project name so the current hms_mongo_data volume
# remains attached when upgrading from the previous project.
name: hms

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hospital_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hospital_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CLIENT_URL: http://localhost:3010
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random 32+ character value}
      JWT_EXPIRE: ${JWT_EXPIRE:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set independently}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY must be set independently}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@medcare-hms.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-MedCare HMS}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-15}
      RESET_TOKEN_EXPIRE: ${RESET_TOKEN_EXPIRE:-10}
      OTP_EXPIRE: ${OTP_EXPIRE:-5}
      TOTP_APP_NAME: ${TOTP_APP_NAME:-MedCare HMS}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-15}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-50}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-5}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      BUILD_SHA: ${BUILD_SHA:-local}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      UPLOAD_PATH: ./uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_DASHBOARD: ${CACHE_TTL_DASHBOARD:-30}
      CACHE_TTL_STATS: ${CACHE_TTL_STATS:-60}
      CACHE_TTL_MEDICINES: ${CACHE_TTL_MEDICINES:-120}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-3}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/hospital_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@medcare-hms.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-MedCare HMS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-3}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random 32+ character value}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set independently}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY must be set independently}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3010:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
  backend_uploads:
  backend_logs:
